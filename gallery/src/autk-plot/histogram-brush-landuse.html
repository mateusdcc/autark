<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Autark (Examples)</title>
    <link rel="stylesheet" href="/src/autk-plot/histogram-brush.css">
</head>

<body>
    <div id="app">
        <h2>histogram-brush-landuse.ts</h2>
        <canvas> </canvas>
        <div id="plot">
            <div id="plotBar"></div>
            <div id="plotBody"></div>
        </div>
    </div>
</body>
<script type="module" src="/src/autk-plot/histogram-brush-landuse.ts"></script>

<script>
    function floatingPlot() {
        let newX = 0,
            newY = 0,
            startX = 0,
            startY = 0;

        const plot = document.querySelector('#plot');
        const bar = document.querySelector('#plotBar');

        bar.style.touchAction = 'none';
        bar.addEventListener('pointerdown', pointerDown);
        bar.addEventListener('pointermove', pointerMove);
        bar.addEventListener('pointerup', pointerUp);
        bar.addEventListener('pointercancel', pointerUp);
        plot.style.visibility = 'visible';

        function pointerDown(e) {
            startX = e.clientX;
            startY = e.clientY;
            bar.setPointerCapture(e.pointerId);

            e.preventDefault();
            e.stopPropagation();
        }

        function pointerMove(e) {
            if (!bar.hasPointerCapture(e.pointerId)) return;

            newX = startX - e.clientX;
            newY = startY - e.clientY;

            startX = e.clientX;
            startY = e.clientY;

            plot.style.top = plot.offsetTop - newY + 'px';
            plot.style.left = plot.offsetLeft - newX + 'px';

            e.preventDefault();
            e.stopPropagation();
        }

        function pointerUp(e) {
            if (bar.hasPointerCapture(e.pointerId)) {
                bar.releasePointerCapture(e.pointerId);
            }

            e.preventDefault();
            e.stopPropagation();
        }
    }
    floatingPlot();
</script>

</html>
